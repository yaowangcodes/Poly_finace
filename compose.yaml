services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/.data
    volumes:
      - chat-data:/app/.data
    restart: unless-stopped

volumes:
  chat-data:
